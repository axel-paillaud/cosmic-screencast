[package]
name = "cosmic-screencast"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
ashpd = { version = "0.14.0", default-features = false, features = ["tokio", "screencast"] }
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
pipewire = "0.10.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
