[package]
name = "cosmic-screencast"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
ashpd = { version = "0.14.0", default-features = false, features = ["tokio", "screencast"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
gifski = { version = "1.34.0", default-features = false }
imgref = "1.12.3"
jiff = "0.2.43"
pipewire = "0.10.1"
rgb = "0.8.53"
# COSMIC's toolkit (not on crates.io). Pinned to a commit so builds are reproducible.
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "1e539b94fb891a91d0182c288140788f97334449", default-features = false, features = [
    "wayland",
    "tokio",
    "wgpu",
    "dbus-config",
] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
libc = "0.2"

# Optimize dependencies even in debug builds: gifski is very slow unoptimized.
# Our own code stays in debug mode, so it still compiles fast.
[profile.dev.package."*"]
opt-level = 3
